<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(raid.png) no-repeat;background-size:1664px 936px;background-position:-252px -130px;filter:saturate(1.35) contrast(1.12) brightness(1.04)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,4,30,.92) 0%,rgba(10,4,30,.78) 30%,rgba(10,4,30,.15) 52%,rgba(0,0,0,0) 62%),linear-gradient(0deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%)}
.glow{position:absolute;left:520px;top:30px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,80,255,.35),rgba(255,80,255,0) 65%);mix-blend-mode:screen}
.t{position:absolute;left:44px;font-family:'Inter Display','Inter',sans-serif;font-weight:900;letter-spacing:-2px;line-height:.9;text-transform:uppercase;
  -webkit-text-stroke:3px #0b0420;paint-order:stroke fill;text-shadow:0 8px 0 #0b0420,0 14px 30px rgba(0,0,0,.7)}
.l1{top:118px;font-size:96px;color:#fff}
.l2{top:214px;font-size:150px;color:#ffe03a;transform:rotate(-2deg);transform-origin:left}
.l3{top:368px;font-size:150px;color:#fff}
.badge{position:absolute;left:48px;top:560px;padding:14px 26px 16px;border-radius:18px;background:linear-gradient(135deg,#a24bff,#ff3d8b);
  font-family:'Inter Display','Inter',sans-serif;font-weight:900;font-size:50px;color:#fff;letter-spacing:-1px;transform:rotate(-3deg);
  box-shadow:0 0 0 5px #0b0420,0 12px 30px rgba(0,0,0,.6)}
.badge span{color:#ffe03a}
.arrow{position:absolute;left:470px;top:300px;width:190px;height:120px}
</style></head><body>
<div class="bg"></div><div class="glow"></div><div class="shade"></div>
<div class="t l1">My chat</div>
<div class="t l2">lives</div>
<div class="t l3">here!</div>
<div class="badge">RAID! <span>+40</span> VIEWERS</div>
<svg class="arrow" viewBox="0 0 190 120"><path d="M8 100 C 60 100, 110 80, 150 30" fill="none" stroke="#0b0420" stroke-width="26" stroke-linecap="round"/><path d="M8 100 C 60 100, 110 80, 150 30" fill="none" stroke="#ffe03a" stroke-width="15" stroke-linecap="round"/>
<path d="M118 22 L170 6 L160 60 Z" fill="#ffe03a" stroke="#0b0420" stroke-width="7" stroke-linejoin="round"/></svg>
</body></html>
